# The app's toolchain: the project's pinned Rust, plus the targets an iPhone
# build needs. rustup reads the nearest file, so this one governs app/.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-apple-darwin"]
profile = "minimal"
