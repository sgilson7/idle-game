[package]
name = "idlewright"
version = "1.0.0"
edition = "2021"
description = "Idlewright for the App Store: the web game's own files in Tauri 2, with saves, the purchase and notifications on the phone. Decides nothing."
publish = false

# Its own workspace: the web build and its checks never compile Tauri.
[workspace]

[lib]
name = "idlewright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned exactly, at versions at least two weeks old when chosen (2026-10-25).
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-apple = { path = "apple" }
# The notification plugin's own date type, for scheduling.
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
